services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caa-lab-app
    restart: "no"
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_NAME=CAA-Lab
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-caa-lab-insecure-secret-key-change-in-production}
      - DATABASE_URL=sqlite:///./data/caa_lab.db
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
