[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caa-lab"
version = "0.1.0"
description = "Aplicação Web de Comunicação Aumentativa e Alternativa"
authors = [
    { name = "Laboratório Tecnológico Inclusivo", email = "contato@caa-lab.local" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "jinja2>=3.1.3",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
